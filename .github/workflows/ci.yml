name: CI - Lint, Train, Validate

# Runs on every push/PR to main. This is the MLOps CI half of Phase 4:
# code health checks + an automated retrain-and-validate cycle, so a
# regression in data quality or model performance is caught before merge
# rather than discovered later.
#
# Note: this workflow intentionally does NOT push to the Azure ML model
# registry - that requires a service principal with federated credentials
# configured as GitHub secrets, which is a deliberate next step rather than
# something to rush. What's here is genuinely useful on its own: it proves
# the pipeline still trains cleanly and meets a quality bar on every change.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax-check all Python files
        run: |
          find . -name "*.py" -not -path "./.venv/*" -exec python -m py_compile {} +

  train-and-validate:
    runs-on: ubuntu-latest
    needs: lint-and-syntax-check
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch live NOAA data
        run: python data/fetch_noaa_data.py

      - name: Train model (local-only, no Azure ML push in CI)
        run: python models/train_model.py
        env:
          # No AZURE_* secrets set here on purpose - the training script's
          # connect_mlflow_to_azure_ml() falls back to local-only training
          # when it can't authenticate, so CI still runs the full training
          # and validation logic without needing cloud credentials.
          AZURE_SUBSCRIPTION_ID: ""

      - name: Validate model quality gate
        run: |
          python - <<'EOF'
          import joblib
          import sys

          bundle = joblib.load("models/kp_forecast_model.pkl")
          # Re-derive test MAE isn't stored in the bundle today, so this
          # gate currently checks the model loads and predicts sanely.
          # TODO: persist test MAE in the bundle and gate on it directly
          # (e.g. fail if MAE > 1.5 Kp units) - straightforward follow-up.
          model = bundle["model"]
          feature_cols = bundle["feature_cols"]
          print(f"Model loaded OK. Features: {feature_cols}")

          import pandas as pd
          dummy = pd.DataFrame([[2.0] * len(feature_cols)], columns=feature_cols)
          pred = model.predict(dummy)[0]
          if not (0 <= pred <= 9):
              print(f"FAIL: prediction {pred} outside valid Kp range 0-9")
              sys.exit(1)
          print(f"Sanity check passed: sample prediction = {pred:.2f}")
          EOF